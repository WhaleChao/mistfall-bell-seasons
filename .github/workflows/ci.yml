name: PixelRPG CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e './creator_service[test]'
      - run: python scripts/validate_content.py --release
      - run: python scripts/audit_release.py
      - run: pytest tests/python

  godot-smoke:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v7
      - run: godot --headless --path . --editor --quit
      - run: godot --headless --path . --script res://tests/godot/smoke_test.gd
      - run: godot --headless --path . --script res://tests/godot/performance_test.gd

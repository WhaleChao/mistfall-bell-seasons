name: PixelRPG CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e './creator_service[test]'
      - run: python scripts/validate_content.py --release
      - run: python scripts/audit_release.py
      - run: pip-audit --local
      - run: pytest tests/python

  godot-smoke:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    env:
      PIXELRPG_TEST_ISOLATED: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install Godot headless font runtime
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1
          rm -rf /var/lib/apt/lists/*
      - name: Run Godot gates and reject engine error output
        shell: bash
        run: |
          set -euo pipefail
          run_godot_gate() {
            local label="$1"
            shift
            local output
            local status
            set +e
            output="$(godot "$@" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [[ $status -ne 0 ]] || printf '%s\n' "$output" | grep -Eqi '^\s*(SCRIPT ERROR:|ERROR:)|Parse Error|Compile Error|Failed to load script|Failed to load resource'; then
              printf 'Godot gate failed: %s (exit %s)\n' "$label" "$status" >&2
              exit 1
            fi
          }
          run_godot_gate editor --headless --path . --editor --quit
          run_godot_gate smoke --headless --path . --script res://tests/godot/smoke_test.gd
          run_godot_gate images --headless --path . --script res://tests/godot/image_integrity_test.gd
          run_godot_gate stress --headless --path . --script res://tests/godot/commercial_stress_test.gd
          run_godot_gate performance --headless --path . --script res://tests/godot/performance_test.gd

name: Published Release Verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Public GitHub release tag to verify
        required: true
        default: v1.2.0
      expected_sha256:
        description: Optional expected SHA-256 for the Windows ZIP
        required: false
        default: ''

permissions:
  contents: read

jobs:
  clean-windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download and verify the public Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          ./launcher/Test-PublishedRelease.ps1 `
            -Repository '${{ github.repository }}' `
            -Tag $env:TEST_TAG `
            -ExpectedSha256 $env:EXPECTED_SHA256 `
            -ReportDirectory 'reports/published_release'
          Get-Content reports/published_release/report.json | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Exercise Authenticode signing pipeline on an isolated copy
        shell: pwsh
        run: |
          $releaseReport = Get-Content reports/published_release/report.json -Raw | ConvertFrom-Json
          $publishedExe = Join-Path $releaseReport.extracted_package_root 'Mistfall-Bell-Seasons.exe'
          ./launcher/Test-CodeSigningPipeline.ps1 `
            -SourceExecutable $publishedExe `
            -ReportPath 'reports/published_release/code_signing_pipeline.json'
      - name: Upload clean-Windows evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: published-release-${{ inputs.tag || github.event.release.tag_name }}-windows-evidence
          path: reports/published_release/
          if-no-files-found: error

  clean-macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download and verify the public macOS Universal release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TEST_TAG#v}"
          archive="Mistfall-Bell-Seasons-${TEST_TAG}-macOS-Universal.zip"
          mkdir -p work/published-macos-download reports/published_macos_release
          gh release download "$TEST_TAG" --repo '${{ github.repository }}' --dir work/published-macos-download --pattern "$archive" --pattern 'SHA256SUMS.txt'
          expected="$(tr -d '\r' < work/published-macos-download/SHA256SUMS.txt | awk -v name="$archive" '$2 == name {print $1}')"
          actual="$(shasum -a 256 "work/published-macos-download/$archive" | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
          chmod +x launcher/Test-macOS-Archive.sh
          ./launcher/Test-macOS-Archive.sh "work/published-macos-download/$archive" "$version" 'reports/published_macos_release'
          cat reports/published_macos_release/report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload clean-macOS evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: published-release-${{ inputs.tag || github.event.release.tag_name }}-macos-evidence
          path: reports/published_macos_release/
          if-no-files-found: error
